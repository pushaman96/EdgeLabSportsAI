name: Grade published paper picks
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
concurrency:
  group: published-pick-grading
  cancel-in-progress: false
jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python pick_history.py
      - name: Save completed grades
        run: |
          if ! git diff --quiet -- published_picks.json; then
            git config user.name "Kamikaze Picks grading"
            git config user.email "actions@users.noreply.github.com"
            git add published_picks.json
            git commit -m "Grade completed paper picks"
            git pull --rebase origin main
            git push
          fi
