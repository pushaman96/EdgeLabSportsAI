name: Grade published paper picks
on:
  push:
    paths:
      - '*.py'
      - 'tests/**'
      - '.github/workflows/grade_picks.yml'
  workflow_dispatch:
  schedule:
    - cron: '2,17,32,47 * * * *'
permissions:
  contents: write
concurrency:
  group: published-pick-grading
  cancel-in-progress: false
jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Archive live game observations using free ESPN data
        run: python live_game_research.py
      - run: python pick_history.py
      - name: Audit frozen probabilities and measured forecast errors
        run: python forecast_confidence_audit.py
      - name: Save completed grades
        run: |
          if ! git diff --quiet -- live_game_research.json forecast_confidence_audit.json published_picks.json analyzed_forecasts.json game_usage_history.json pick_learning_state.json online_learning_state.json slate_reviews.json workload_reviews.json; then
            git config user.name "Kamikaze Picks grading"
            git config user.email "actions@users.noreply.github.com"
            git add live_game_research.json forecast_confidence_audit.json published_picks.json analyzed_forecasts.json game_usage_history.json pick_learning_state.json online_learning_state.json slate_reviews.json workload_reviews.json
            git commit -m "Grade picks, archive usage and update per-game feedback"
            git pull --rebase origin main
            git push
          fi


