name: Grade published paper picks
on:
  workflow_dispatch:
  schedule:
    - cron: '2,17,32,47 * * * *'
permissions:
  contents: write
concurrency:
  group: published-pick-grading
  cancel-in-progress: false
jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python pick_history.py
      - name: Save completed grades
        run: |
          if ! git diff --quiet -- published_picks.json analyzed_forecasts.json game_usage_history.json pick_learning_state.json online_learning_state.json slate_reviews.json; then
            git config user.name "Kamikaze Picks grading"
            git config user.email "actions@users.noreply.github.com"
            git add published_picks.json analyzed_forecasts.json game_usage_history.json pick_learning_state.json online_learning_state.json slate_reviews.json
            git commit -m "Grade picks, archive usage and update per-game feedback"
            git pull --rebase origin main
            git push
          fi

